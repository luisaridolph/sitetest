---
layout: default
---
<article class="publicacao" data-colecao="{{ page.colecao }}">
  {% include badge-colecao.html colecoes=page.colecao %}
  <h1>{{ page.titulo | default: page.title }}</h1>
  {% if page.data %}<p class="data-publicacao">{{ page.data | date: "%d/%m/%Y" }}</p>{% endif %}

  {{ content }}

  {% if page.arquivo %}
    <p><a href="{{ page.arquivo | relative_url }}" target="_blank">Baixar arquivo</a></p>
  {% endif %}
</article>
